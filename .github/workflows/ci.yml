name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: Mypy (strict)
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }}, PostgreSQL 16)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edp
          POSTGRES_PASSWORD: edp_ci_only
          POSTGRES_DB: edp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edp -d edp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EDP_TEST_DATABASE_URL: postgresql://edp:edp_ci_only@localhost:5432/edp_test
      # Fail instead of skipping if the database is unavailable.
      EDP_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - name: Run unit and integration tests
        run: pytest --cov --cov-report=term --cov-report=xml --junitxml=junit.xml -p no:logging
      - name: Fail if any test was skipped
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse("junit.xml").getroot().find("testsuite")
          skipped = int(suite.get("skipped", 0))
          print(f"tests={suite.get('tests')} failures={suite.get('failures')} "
                f"errors={suite.get('errors')} skipped={skipped}")
          raise SystemExit(1 if skipped else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install bandit==1.9.4 pip-audit==2.10.1
      - name: Bandit (static security analysis)
        run: bandit -r src -c pyproject.toml
      - name: pip-audit (known vulnerabilities in pinned dependencies)
        run: pip-audit -r requirements.txt --strict
      - name: Gitleaks (secret scanning, full git history)
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git . --redact --verbose --exit-code 1
